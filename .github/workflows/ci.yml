# The gate, as CI: the toolkit's tests against scratch repositories, on
# the oldest Python the plugin supports and on a Mac, and the plugin
# manifest validator. Each is its own job so a red run says which one
# failed. Python 3.9 is what a Mac with the command line tools ships;
# the ubuntu leg pins it so anything newer sneaking in fails there. The
# macOS leg runs whatever python3 the runner has, as a learner's would.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: system
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: Which python
        run: python3 --version
      - name: Byte-compile with warnings as errors
        run: python3 -W error -m compileall -q plugins/rolling/lib plugins/rolling/tests .github/scripts evals
      - name: Toolkit tests
        run: cd plugins/rolling/tests && python3 -W error::ResourceWarning -m unittest discover -s . -p 'test_*.py' -v
      - name: Eval harness tests
        run: cd evals/tests && python3 -W error::ResourceWarning -m unittest discover -s . -p 'test_*.py' -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - name: Validate the marketplace manifest
        run: claude plugin validate --strict .
      - name: Validate the rolling plugin
        run: claude plugin validate --strict plugins/rolling
      - name: Validate the rallly map plugin
        run: claude plugin validate --strict plugins/rallly
      - name: Check the rallly map
        run: plugins/rolling/bin/rolling-check-map plugins/rallly

  versions:
    # A change to a plugin reaches an installed learner only through a
    # new version (/plugin update compares versions), so a pull request
    # that changes one must bump it. See the script's header.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every changed plugin has a new version
        run: python3 .github/scripts/check-plugin-versions.py origin/${{ github.base_ref }}
