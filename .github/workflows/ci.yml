# The gate, as CI: the toolkit's tests against scratch repositories, on
# the floor Python and on current ones, and the plugin manifest
# validator. Each is its own job so a red run says which one failed.
#
# The floor leg names /usr/bin/python3 on a Mac, because that is
# Apple's own: what the Command Line Tools ship, and so what the
# shipped scripts' `#!/usr/bin/env python3` finds for a learner who
# has installed nothing else. A 3.10 construct sneaking in fails
# there. The leg cannot read `python3` off PATH, since on a Mac runner
# that is the image's own Python and not Apple's. It asserts the
# version, so Apple moving off 3.9 reads as a decision to make rather
# than as a leg that quietly stopped testing the floor.
#
# The current legs are 3.13 on ubuntu-latest and a Mac's `python3` on
# PATH. The floor cannot be either of them: 3.9 went end-of-life in
# October 2025, and setup-python's builds stop at Ubuntu 24.04, so
# ubuntu-latest moving to 26.04 left it with no 3.9 to install.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: system
          - os: macos-latest
            python: apple
    runs-on: ${{ matrix.os }}
    env:
      # Which interpreter the steps below run. Only the floor leg names
      # a path; the others take whatever `python3` the runner resolves.
      PY: ${{ matrix.python == 'apple' && '/usr/bin/python3' || 'python3' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        if: matrix.python != 'system' && matrix.python != 'apple'
        with:
          python-version: ${{ matrix.python }}
      - name: Which python
        run: $PY --version
      - name: The floor is the Python a Mac's command line tools ship
        if: matrix.python == 'apple'
        run: |
          v=$($PY -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "Apple's /usr/bin/python3 is $v"
          if [ "$v" != "3.9" ]; then
            echo "::error::The floor moved: $v, not 3.9. This leg exists to run the suite on the Python a learner gets from xcode-select --install, and it has stopped doing that. Decide the new floor and say it in CLAUDE.md, REVIEW.md, docs/plan.md, docs/workflow.md, plugins/rolling/README.md, plugins/rolling/lib/rolling/__init__.py and evals/harness/fixture.py, or retire this leg."
            exit 1
          fi
      - name: Byte-compile with warnings as errors
        run: $PY -W error -m compileall -q plugins/rolling/lib plugins/rolling/tests .github/scripts evals
      - name: Toolkit tests
        run: cd plugins/rolling/tests && $PY -W error::ResourceWarning -m unittest discover -s . -p 'test_*.py' -v
      - name: Eval harness tests
        run: cd evals/tests && $PY -W error::ResourceWarning -m unittest discover -s . -p 'test_*.py' -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - name: Validate the marketplace manifest
        run: claude plugin validate --strict .
      - name: Validate the rolling plugin
        run: claude plugin validate --strict plugins/rolling
      - name: Validate the rallly map plugin
        run: claude plugin validate --strict plugins/rallly
      - name: Check the rallly map
        run: plugins/rolling/bin/rolling-check-map plugins/rallly

  versions:
    # A change to a plugin reaches an installed learner only through a
    # new version (/plugin update compares versions), so a pull request
    # that changes one must bump it. See the script's header.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every changed plugin has a new version
        run: python3 .github/scripts/check-plugin-versions.py origin/${{ github.base_ref }}
