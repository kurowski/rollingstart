name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # Write on pull requests and issues: the documented review examples
    # and every working report on the action's tracker (#1523) use them;
    # the installer's read-only template is a known no-op (#1383).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action posts and updates a tracking comment itself, so a run
          # that ends before the review (the plugin's first step launches a
          # subagent the action may not wait for, #1646) is visible on the
          # PR instead of a green check and silence. show_full_output puts
          # the model's tool calls in the job log, which is the only way to
          # see which call a permission denial was; turn it on to diagnose
          # a silent run, and off again, since the log then carries file
          # contents and tool output.
          track_progress: true
          show_full_output: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The tools the code-review skill declares for itself: inline
          # comments for findings, and `gh pr comment` for the summary it
          # posts when it finds none. With only the inline tool allowed, a
          # clean review was a denied call and silence on the PR (#9, #11).
          # And the skill itself: the prompt invokes it through the Skill
          # tool, which is a permission like any other. Without it every
          # run was denied at its first call and either gave up behind the
          # tracking comment's placeholder (#16's first run, three turns,
          # seven denials) or reviewed by hand with what was left. The two
          # git grants let the skill see the branch against main.
          claude_args: '--allowedTools "Skill(code-review:code-review),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git fetch:*),Bash(git diff:*),Bash(git log:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

